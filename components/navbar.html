<script>
(function(){
  // ── Hamburger toggle ──
  window.toggleHamburgerMenu = function(){
    const menu = document.getElementById('slide-menu');
    const overlay = document.getElementById('menu-overlay');
    const btn = document.getElementById('hamburger-btn');
    if(!menu) return;
    const isOpen = menu.classList.contains('open');
    if(isOpen){ closeHamburgerMenu(); }
    else {
      menu.classList.add('open');
      overlay.classList.add('open');
      btn.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
  };

  window.closeHamburgerMenu = function(){
    const menu = document.getElementById('slide-menu');
    const overlay = document.getElementById('menu-overlay');
    const btn = document.getElementById('hamburger-btn');
    if(menu) menu.classList.remove('open');
    if(overlay) overlay.classList.remove('open');
    if(btn) btn.classList.remove('active');
    document.body.style.overflow = '';
  };

  // Close on ESC
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') window.closeHamburgerMenu && window.closeHamburgerMenu();
  });

  // ── Nav-lang-btn label sync ──
  const savedLang = localStorage.getItem('bts_lang') || 'en';
  const langLabels = {en:'🌐 Language',ru:'🌐 Язык',de:'🌐 Sprache',fr:'🌐 Langue',it:'🌐 Lingua',cs:'🌐 Jazyk',pl:'🌐 Język',zh:'🌐 语言',ja:'🌐 言語'};
  const btn = document.getElementById('nav-lang-btn');
  if(btn && langLabels[savedLang]) btn.textContent = langLabels[savedLang];
})();
</script>
