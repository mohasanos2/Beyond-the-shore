<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https: blob:; font-src https://fonts.gstatic.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://api.emailjs.com; frame-ancestors 'none';">
<meta name="theme-color" content="#0797A8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Create Account — Beyond The Shore</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.error('Service Worker registration failed', err));
    });
  }
</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Beyond The Shore</div>
    <div class="auth-sub">Your gateway to extraordinary experiences</div>
    <div class="auth-title">Create your account</div>
    <div class="auth-note">✓ Free to join · No payment required · Book trips instantly</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-field">
      <label class="auth-label" for="reg-name">Full Name</label>
      <input class="auth-input" type="text" id="reg-name" placeholder="Your full name" autocomplete="name"/>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="reg-email">Email Address</label>
      <input class="auth-input" type="email" id="reg-email" placeholder="you@email.com" autocomplete="email"/>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="reg-password">Password</label>
      <input class="auth-input" type="password" id="reg-password" placeholder="At least 6 characters" autocomplete="new-password"/>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="reg-confirm">Confirm Password</label>
      <input class="auth-input" type="password" id="reg-confirm" placeholder="Repeat your password" autocomplete="new-password"/>
    </div>
    <button class="auth-btn" onclick="doRegister()">Create Account</button>
    <div class="auth-link">Already have an account? <a href="login.html">Sign in</a></div>
  </div>
</div>
<script src="js/auth.js"></script>
<script>
// If already logged in, redirect
if (window.Auth.isAuthenticated()) {
  window.location.href = 'index.html';
}

function showErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doRegister() {
  const name = document.getElementById('reg-name').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const confirm = document.getElementById('reg-confirm').value;
  document.getElementById('auth-err').style.display = 'none';

  if (!name || !email || !password || !confirm) { showErr('Please fill in all fields.'); return; }
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) { showErr('Please enter a valid email address.'); return; }
  if (password.length < 6) { showErr('Password must be at least 6 characters.'); return; }
  if (password !== confirm) { showErr('Passwords do not match.'); return; }

  const result = await window.Auth.register(name, email, password);
  if (!result.ok) { showErr(result.error); return; }

  const _redir = localStorage.getItem('auth_redirect') || 'index.html';
  localStorage.removeItem('auth_redirect');
  const _safeRedir = (_redir.startsWith('http://') || _redir.startsWith('https://') || _redir.startsWith('//')) ? 'index.html' : _redir;
  window.location.href = _safeRedir;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doRegister();
});
</script>
</body>
</html>
