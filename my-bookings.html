<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="robots" content="noindex"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Bookings — Beyond The Shore</title>
<meta name="theme-color" content="#0797A8"/>
<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
<link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.error('Service Worker registration failed', err));
    });
  }
</script>
</head>
<body>

<div class="bg-emojis" id="bg-emojis">
  <span class="bg-emoji">🐬</span>
  <span class="bg-emoji">🐢</span>
  <span class="bg-emoji">🪸</span>
  <span class="bg-emoji">🐠</span>
  <span class="bg-emoji">🦭</span>
  <span class="bg-emoji">🌊</span>
  <span class="bg-emoji">🐟</span>
  <span class="bg-emoji">⭐</span>
  <span class="bg-emoji">🐬</span>
  <span class="bg-emoji">🪸</span>
  <span class="bg-emoji">🐙</span>
  <span class="bg-emoji">🐡</span>
</div>

<div id="navbar-component"></div>

<main style="max-width:760px;margin:0 auto;padding:7rem 1.5rem 5rem">
  <h1 style="font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;color:var(--ink,#1a1a2e);margin-bottom:0.5rem;line-height:1.2">
    My Bookings
  </h1>
  <p style="font-family:Outfit,sans-serif;font-size:0.9rem;color:var(--ink-mid,#888);margin-bottom:2.5rem;line-height:1.6">
    Booking requests submitted from this device.
    <button onclick="location.reload()"
      style="margin-left:0.75rem;background:none;border:1px solid var(--border,#e0e0e0);border-radius:20px;padding:0.2rem 0.7rem;font-size:0.78rem;cursor:pointer;color:var(--ink-mid,#888);font-family:Outfit,sans-serif">
      ↻ Refresh
    </button>
  </p>
  <div id="email-form" style="display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;margin-bottom:2rem">
    <input type="email" id="booking-email" placeholder="your@email.com" autocomplete="email"
      style="flex:1;min-width:200px;padding:0.75rem 1rem;border:1px solid var(--border,#e0e0e0);border-radius:50px;font-family:Outfit,sans-serif;font-size:0.9rem;outline:none"/>
    <button type="button" onclick="loadBookings()"
      style="padding:0.75rem 1.5rem;background:var(--teal,#0797A8);color:#fff;border:none;border-radius:50px;font-family:Outfit,sans-serif;font-size:0.9rem;font-weight:600;cursor:pointer;white-space:nowrap">
      View My Bookings
    </button>
  </div>
  <div id="bookings-list"></div>
</main>

<div id="footer-component"></div>
<div id="whatsapp-component"></div>
<script src="js/componentLoader.js"></script>
<script src="js/config.js"></script>
<script>
(function(){
  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  const list = document.getElementById('bookings-list');

  window.loadBookings = function() {
    const email = document.getElementById('booking-email').value.trim();
    if (!email) {
      list.innerHTML = '<div style="text-align:center;padding:3rem;font-family:Outfit,sans-serif;color:#888">Enter your email to see your bookings.</div>';
      return;
    }

    list.innerHTML = '<div style="text-align:center;padding:3rem;font-family:Outfit,sans-serif;color:#888">Loading your bookings...</div>';

    const _apiBase = (window.BTS_CONFIG && window.BTS_CONFIG.API_URL) || 'https://beyond-the-shore-api.onrender.com';
    fetch(_apiBase + '/api/bookings/my?email=' + encodeURIComponent(email))
      .then(r => r.json())
      .then(function(bookings) {
        if (!bookings.length) {
          list.innerHTML =
            '<div style="text-align:center;padding:4rem 1rem;color:var(--ink-mid,#888);font-family:Outfit,sans-serif">' +
              '<div style="font-size:3.5rem;margin-bottom:1rem">🌊</div>' +
              '<p style="font-size:1rem;margin-bottom:0.5rem;font-weight:500;color:var(--ink,#1a1a2e)">No bookings found for this email.</p>' +
              '<a href="booking-dest.html" style="display:inline-block;padding:0.8rem 2rem;background:var(--teal,#0797A8);color:#fff;border-radius:50px;text-decoration:none;font-weight:600;font-size:0.9rem;font-family:Outfit,sans-serif">📋 Book a Trip</a>' +
            '</div>';
          return;
        }

        const statusColor = {
          'Pending Confirmation': '#F4A535',
          'Confirmed': '#3DB85C',
          'Cancelled': '#e05c3a'
        };

        list.innerHTML = bookings.map(function(b) {
          const sc = statusColor[b.status] || '#888';
          const guestLine = b.guests_adults + ' adult' + (b.guests_adults !== 1 ? 's' : '') +
            (b.guests_children > 0 ? ', ' + b.guests_children + ' child' + (b.guests_children > 1 ? 'ren' : '') : '');
          const submittedDate = new Date(b.created_at).toLocaleDateString('en-GB', {
            day: 'numeric', month: 'short', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
          });
          return '<div style="border:1px solid var(--border,#e0e0e0);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1rem;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04)">' +
            '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.85rem">' +
              '<div>' +
                '<div style="font-family:\'Cormorant Garamond\',serif;font-size:1.25rem;font-weight:600;color:var(--ink,#1a1a2e)">' + esc((b.trips && b.trips.name) || b.trip_id) + '</div>' +
                '<div style="font-family:Outfit,sans-serif;font-size:0.75rem;color:var(--ink-mid,#aaa);margin-top:2px">' + esc(b.id) + '</div>' +
              '</div>' +
              '<span style="font-family:Outfit,sans-serif;font-size:0.72rem;font-weight:700;padding:0.25rem 0.75rem;border-radius:50px;background:' + esc(sc) + '22;color:' + esc(sc) + ';white-space:nowrap;margin-left:0.5rem">' + esc(b.status) + '</span>' +
            '</div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.35rem 1rem;font-family:Outfit,sans-serif;font-size:0.84rem;color:var(--ink-mid,#666)">' +
              '<span>📅 ' + esc(b.date) + '</span>' +
              '<span>👥 ' + esc(guestLine) + '</span>' +
            '</div>' +
            '<div style="margin-top:0.85rem;padding-top:0.75rem;border-top:1px solid var(--border,#f0f0f0);font-family:Outfit,sans-serif;font-size:0.75rem;color:var(--ink-light,#bbb)">' +
              'Submitted ' + submittedDate +
            '</div>' +
          '</div>';
        }).join('');
      })
      .catch(function() {
        list.innerHTML = '<div style="text-align:center;padding:3rem;font-family:Outfit,sans-serif;color:#e05c3a">Could not load bookings. Please try again.</div>';
      });
  };
})();
</script>
</body>
</html>
