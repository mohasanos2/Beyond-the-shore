<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https: blob:; font-src https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';">
<meta name="theme-color" content="#0797A8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Beyond The Shore</title>
<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<link rel="manifest" href="/manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registered', reg))
        .catch(err => console.error('Service Worker registration failed', err));
    });
  }
</script>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">Beyond The Shore</div>
    <div class="auth-sub">Your gateway to extraordinary experiences</div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-err" id="auth-err"></div>
    <div class="auth-field">
      <label class="auth-label" for="login-email">Email Address</label>
      <input class="auth-input" type="email" id="login-email" placeholder="you@email.com" autocomplete="email"/>
    </div>
    <div class="auth-field">
      <label class="auth-label" for="login-password">Password</label>
      <input class="auth-input" type="password" id="login-password" placeholder="Your password" autocomplete="current-password"/>
    </div>
    <button class="auth-btn" onclick="doLogin()">Sign In</button>
    <div class="auth-link">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
</div>
<script src="js/auth.js"></script>
<script>
// If already logged in, redirect
if (window.Auth.isAuthenticated()) {
  const _redir = localStorage.getItem('auth_redirect') || 'index.html';
  localStorage.removeItem('auth_redirect');
  const _safeRedir = (_redir.startsWith('http://') || _redir.startsWith('https://') || _redir.startsWith('//')) ? 'index.html' : _redir;
  window.location.href = _safeRedir;
}

function showErr(msg) {
  const el = document.getElementById('auth-err');
  el.textContent = msg;
  el.style.display = 'block';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  document.getElementById('auth-err').style.display = 'none';

  if (!email || !password) { showErr('Please fill in all fields.'); return; }
  if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) { showErr('Please enter a valid email address.'); return; }

  // Brute-force rate limit: max 5 attempts per 15 minutes
  const RL_KEY = 'bts_login_rl';
  const RL_MAX = 5, RL_WINDOW = 15 * 60 * 1000;
  try {
    const rl = JSON.parse(sessionStorage.getItem(RL_KEY) || '{"count":0,"start":0}');
    if (Date.now() - rl.start > RL_WINDOW) { rl.count = 0; rl.start = Date.now(); }
    if (rl.count >= RL_MAX) {
      const wait = Math.ceil((RL_WINDOW - (Date.now() - rl.start)) / 60000);
      showErr(`Too many attempts. Please try again in ${wait} minute${wait !== 1 ? 's' : ''}.`);
      return;
    }
    rl.count++;
    sessionStorage.setItem(RL_KEY, JSON.stringify(rl));
  } catch(_e) {}

  const result = await window.Auth.login(email, password);
  if (!result.ok) { showErr(result.error); return; }

  const _redir = localStorage.getItem('auth_redirect') || 'index.html';
  localStorage.removeItem('auth_redirect');
  const _safeRedir = (_redir.startsWith('http://') || _redir.startsWith('https://') || _redir.startsWith('//')) ? 'index.html' : _redir;
  window.location.href = _safeRedir;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
