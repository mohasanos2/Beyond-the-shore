<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://www.gstatic.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https: blob:; font-src https://fonts.gstatic.com; connect-src 'self' https://bgkwvyjyjorzwtuircmf.supabase.co https://beyond-the-shore-api.onrender.com; frame-ancestors 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page Not Found — Beyond The Shore</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/x-icon" href="images/favicon.ico"/>
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
<style>
.notfound-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;gap:1.2rem}
.notfound-emoji{font-size:4rem}
.notfound-code{font-family:'Cormorant Garamond',serif;font-size:6rem;font-weight:600;color:var(--teal);line-height:1}
.notfound-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--ink)}
.notfound-sub{font-family:Outfit,sans-serif;font-size:0.95rem;color:var(--ink-light);max-width:380px}
.notfound-btn{margin-top:0.5rem;padding:0.75rem 2rem;border-radius:50px;background:var(--teal);color:#fff;font-family:Outfit,sans-serif;font-weight:600;font-size:0.9rem;text-decoration:none}
</style>
</head>
<body>
<div class="notfound-wrap">
  <div class="notfound-emoji">🌊</div>
  <div class="notfound-code">404</div>
  <div class="notfound-title">Lost at Sea</div>
  <p class="notfound-sub">This page drifted away. Let's get you back to the shore.</p>
  <a href="index.html" class="notfound-btn">Back to Home</a>
</div>
</body>
</html>
